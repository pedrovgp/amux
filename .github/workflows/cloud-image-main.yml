# amux Cloud servers follow main as it lands (Ethan, 2026-10-27: "make sure all
# amux cloud instances always immediately get the latest as they come out from
# main"). Every push to main builds the same image deploy-cloud.yml builds and
# tags it :main; each standalone server checks for a new :main every two
# minutes, installs it, and puts its previous binaries back (holding that
# image) if the server does not pass /health (cloud/desktop/update.sh).
#
# :latest is unchanged: deploy-cloud.yml still builds it only after all of CI
# passes, and the multi-tenant gateway still deploys from it. A server pinned
# to green builds sets AMUX_IMAGE_TAG=latest.
name: cloud image (main)

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'cloud/docker/**'
      - 'amux'
  workflow_dispatch:

# Only the newest commit matters: a push supersedes the build of the one before it.
concurrency:
  group: cloud-image-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mixpeek/amux

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            AMUX_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
